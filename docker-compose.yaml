services:
  unischeduler-db:
    image: postgres:18-alpine
    container_name: unischeduler-db-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - unischeduler-db-data:/var/lib/postgresql
    networks:
      - unischeduler-network

  unischeduler-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unischeduler-service-container
    restart: on-failure:3
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      unischeduler-db:
        condition: service_healthy
    networks:
      - unischeduler-network

volumes:
  unischeduler-db-data:

networks:
  unischeduler-network:
    driver: bridge