spring.application.name=unischeduler-backend
server.servlet.context-path=/api

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.session.jdbc.initialize-schema=always
spring.session.timeout=7d

spring.security.oauth2.client.registration.microsoft.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.scope[0]=openid
spring.security.oauth2.client.registration.microsoft.scope[1]=email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

app.cors.allowed-origins=${FRONTEND_URL}
app.auth.failure-redirect-url=${FRONTEND_FAILURE_URL:${FRONTEND_URL}/login?error=auth_failed}
app.auth.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:ukma.edu.ua}
